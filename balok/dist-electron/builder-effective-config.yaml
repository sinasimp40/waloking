directories:
  output: dist-electron
  buildResources: build
appId: com.launcher.app
productName: Launcher
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
win:
  target:
    - dir
  icon: public/icon.ico
  artifactName: Balok-Portable-${version}.${ext}
linux:
  target:
    - dir
beforePack: ./scripts/integrity-beforepack.js
afterPack: ./scripts/integrity-postpack.js
afterSign: ./scripts/integrity-postpack.js
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
extraResources:
  - from: branding/ota-config.json
    to: ota-config.json
electronVersion: 31.7.7
